<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Página de relatórios do sistema NetNúcleo">
    <meta name="author" content="Bárbara Rodrigues">
    <meta name="language" content="pt-br">
    <meta name="robots" content="index, follow">
    <meta name="color-scheme" content="dark light">

     <link rel="stylesheet" href="/sisged-api/public/css/relatorios.css">
     <link rel="stylesheet" href="/sisged-api/public/css/base.css">
     <link rel="icon" type="image/png" href="/sisged-api/public/img/favicon.jpg">
   
    <title>Relatórios | SISGED</title>
    
    </head>
    <body>
        <!-- CABEÇALHO -->
        <header class="topbar">

        <section class="logo-image">

        <!-- Espaço reservado para imagem/identidade visual -->
            <img src="/sisged-api/public/logo_senai.png" alt="logo" class="logo" >

        </section>

        <a href="dashboard.html" class="logo-link">

            <strong>SISGED</strong>

        </a>
            <!-- MENU SUPERIOR -->
        <nav class="top-menu">

            <a href="consultas.html" >
                Consulta
            </a>

            <a href="relatorios.html" class="active">
                Relatório
            </a>

            <a href="perfil.html">
                 Perfil
            </a>

            <a href="cadastro.html" >
                Cadastro
            </a>
                    
            <a href="movimentacao.html" >
                Movimentação
            </a>

            <a href="utilitarios.html" >
                    Utilitários
            </a>

        </nav>


            <!-- USUÁRIO -->
            <div class="user-area">

                <div class="user-info">
                    <strong>Usuário</strong>
                    <span>Usuário</span>
                </div>

                <div class="user-icon">
                    ♙
                </div>

            </div>

        </header>


        <!-- CONTEÚDO -->
        <main class="main-content">

            <!-- TÍTULO -->
            <section class="page-header">

                <h1>Relatórios Pedagógicos</h1>

                <p>
                    Consulte e gere relatórios pedagógicos da sua instituição.
                </p>

            </section>


            <!-- ÁREA DE FILTROS -->
            <section class="report-filters">


                <!-- TIPO DE RELATÓRIO -->
                <div class="form-group">

                    <label for="tipo-relatorio">
                        Tipo de Relatório
                    </label>

                    <select id="tipo-relatorio" name="tipo-relatorio">

                        <option value="">
                            Selecione
                        </option>

                        <!--
                            Os tipos de relatório
                            serão inseridos pelo PHP.
                        -->

                    </select>

                </div>


                <!-- ALUNO -->
                <div class="form-group aluno-field">

                    <label for="aluno">
                        Aluno
                    </label>

                    <div class="search-input">

                        <span>⌕</span>

                        <input
                            type="search"
                            id="aluno"
                            name="aluno"
                            placeholder="Buscar por nome ou matrícula"
                        >

                    </div>

                </div>


                <!-- TURMA -->
                <div class="form-group">

                    <label for="turma">
                        Turma
                    </label>

                    <select id="turma" name="turma">

                        <option value="">
                            Selecione
                        </option>

                        <!--
                            As turmas serão inseridas pelo PHP.
                        -->

                    </select>

                </div>


                <!-- DISCIPLINA -->
                <div class="form-group">

                    <label for="disciplina">
                        Disciplina
                    </label>

                    <select id="disciplina" name="disciplina">

                        <option value="">
                            Todas as Disciplinas
                        </option>

                        <!--
                            As disciplinas serão inseridas pelo PHP.
                        -->

                    </select>

                </div>


                <!-- PERÍODO -->
                <div class="form-group">

                    <label for="periodo">
                        Período
                    </label>

                    <select id="periodo" name="periodo">

                        <option value="">
                            Selecione
                        </option>

                        <!--
                            Os períodos serão inseridos pelo PHP.
                        -->

                    </select>

                </div>


                <!-- BOTÕES -->
                <div class="actions">

                    <button
                        type="button"
                        class="generate-button"
                    >
                        Gerar Relatório
                    </button>

                    <button
                        type="button"
                        class="clear-button"
                    >
                        Limpar Filtros
                    </button>

                    <button
                        type="button"
                        class="export-button"
                    >
                        ⇩ Exportar PDF
                    </button>

                </div>

            </section>


            <!-- RESULTADO -->
            <section class="report-result">

                <div class="result-icon">
                    ││
                </div>

                <h2>
                    Nenhum relatório gerado
                </h2>

                <p>
                    Selecione os filtros acima e clique em
                    "Gerar Relatório" para visualizar os resultados.
                </p>

            </section>

        </main>

    <script src="/js/db.js"></script>
    <script src="/js/relatorios.js"></script>
    <script src="/js/vlibras.js"></script>    

    <script src="/js/dark-mode.js"></script>
</body>
</html>
