<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="NetNúcleo - Sistema de gestão e consultas educacionais.">
    <meta name="author" content="Bárbara Rodrigues">
    <meta name="language" content="pt-br">
    <meta name="robots" content="index, follow">
    <meta name="color-scheme" content="dark light">

    <meta http-equiv="refresh" content="0; url=/view/pages/login.html">
   
    <link rel="icon" type="image/png" href="/img/favicon.jpg">
    <link rel="stylesheet" href="/css/base.css">

    <title>NetNúcleo</title>

</head>
<body>
    
    <main class="login-page">

        <section class="login-visual">

            <div class="visual-content">
                <h1>NetNúcleo</h1>
                <p>Sistema de gestão educacional</p>
            </div>

        </section>

        <section class="login-area">

            <div class="login-container">

                <div class="login-header">
                    <h2>Bem-vindo</h2>

                    <p>
                        Acesse sua conta para entrar no NetNúcleo
                    </p>
                </div>


                <form class="login-form">

                    <!-- Unidade -->
                    <div class="form-group">

                        <label for="unidade">
                            Unidade
                        </label>

                        <select id="unidade" name="unidade" required>

                            <option value="" selected disabled>
                                Selecione
                            </option>

                            <option value="unidade1">
                                Unidade 1
                            </option>

                            <option value="unidade2">
                                Unidade 2
                            </option>

                        </select>

                    </div>


                    <!-- Usuário -->
                    <div class="form-group">

                        <label for="usuario">
                            Usuário Institucional
                        </label>

                        <input
                            type="text"
                            id="usuario"
                            name="usuario"
                            placeholder="absobrenome"
                            required
                        >

                    </div>


                    <!-- Senha -->
                    <div class="form-group">

                        <label for="senha">
                            Senha
                        </label>

                        <div class="password-container">

                            <input
                                type="password"
                                id="senha"
                                name="senha"
                                placeholder="Digite sua senha"
                                required
                            >

                            <button
                                type="button"
                                class="show-password"
                                onclick="mostrarSenha()"
                                aria-label="Mostrar senha"
                            >
                                👁
                            </button>

                        </div>

                    </div>


                    <!-- Opções -->
                    <div class="login-options">

                        <label class="remember">

                            <input
                                type="checkbox"
                                id="lembrar"
                                name="lembrar"
                            >

                            <span>Lembrar-me</span>

                        </label>

                        <a href="#">
                            Esqueci minha senha
                        </a>

                    </div>

                    <button
                        type="submit"
                        class="login-button"
                    >
                        Entrar no Sistema
                    </button>

                </form>

            </div>

        </section>

    </main>

    <script src="/img/js/db.js"></script>    
    <script src="/img/js/script.js"></script>
    <script src="/img/js/vlibras.js"></script>

    <script src="/js/dark-mode.js"></script>
</body>
</html>
